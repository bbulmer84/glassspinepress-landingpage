<div id="gsp-sample-modal" class="gsp-modal" aria-hidden="true">
  <div class="gsp-modal-backdrop" data-gsp-close></div>

  <div class="gsp-modal-dialog" role="dialog" aria-modal="true" aria-label="Book sample">
    <button class="gsp-modal-close" type="button small alt" aria-label="Close sample" data-gsp-close>
      &times;
    </button>

    <div class="gsp-modal-header">
      <h2 id="gsp-sample-title">Sample</h2>
      <p id="gsp-sample-subtitle" class="minor"></p>
    </div>

    <div id="gsp-sample-content" class="gsp-modal-content">
      <p class="minor">Loading…</p>
    </div>

    <div class="gsp-modal-footer">
      <button class="button small alt" type="button" data-gsp-close>Close</button>
    </div>
  </div>
</div>
